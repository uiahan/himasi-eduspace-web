server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Perbaikan: Pastikan include fastcgi_params ada di ATAS agar variabel terdefinisi
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Hapus baris fastcgi_split_path_info jika tidak benar-benar butuh pathing kompleks
        # atau pastikan formatnya benar seperti di bawah:
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}