server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/html/public;

    # Tambahkan ini untuk menghindari error upload file besar
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_split_path_info;
    }

    # Kirim log ke Docker logs, bukan ke file di dalam container
    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    # Matikan akses ke file tersembunyi seperti .env
    location ~ /\.(?!well-known).* {
        deny all;
    }
}